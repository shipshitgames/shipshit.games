name: CI

on:
  push:
    branches:
      - master
  # No branch filter: PRs into the master trunk must run the same checks as
  # any other PR — these are required status checks.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # All JS actions on Node 24 ahead of the 2026-06-16 default switch
  # (covers third-party actions still declaring node20, e.g. setup-bun).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Content fetchers (lib/github, lib/youtube) serve committed snapshots in CI.
  CONTENT_SNAPSHOT_ONLY: "1"
  ACCESS_SIGNING_SECRET: ci-access-signing-secret
  CLERK_SECRET_KEY: ci-clerk-secret-key
  NEXT_PUBLIC_APP_URL: http://localhost:3002
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  STRIPE_SKILLS_PRO_PRICE_ID: price_ci_placeholder
  STRIPE_STUDIO_PASS_PRICE_ID: price_ci_placeholder

jobs:
  engine-package:
    name: Engine Package (Three ${{ matrix.three }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - three: "0.169.0"
            types: "0.169.0"
          - three: "0.184.0"
            types: "0.184.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-engine-package-${{ matrix.three }}-${{ hashFiles('bun.lock', 'packages/engine/package.json', 'packages/assetgen/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-engine-package-${{ matrix.three }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Packed Engine Consumer
        run: bun run --cwd packages/engine smoke:package -- ${{ matrix.three }} ${{ matrix.types }}

  engine-package-gate:
    name: Engine Package
    if: always()
    needs: engine-package
    runs-on: ubuntu-latest
    steps:
      - name: Require every Three.js matrix leg
        run: test "${{ needs.engine-package.result }}" = "success"

  monorepo:
    name: Monorepo Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-turbo-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-turbo-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Scaffold Smoke
        run: bun run ci:scaffold

      - name: Engine Package Check
        run: bun run ci:engine

      - name: Ressources CLI Check
        run: bun run ci:ressources

      - name: Lint
        run: bun run lint

      - name: React Doctor
        run: bun run lint:react

      - name: Typecheck
        run: bun run typecheck

      # assetgen asset-qa WebP checks and repairs shell out to cwebp/dwebp
      # (see packages/assetgen/ASSET-QA.md); their tests fail without libwebp.
      - name: Install libwebp Tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Test (with coverage)
        run: bun run test:coverage

      - name: Build
        run: bun run build

  web-e2e:
    name: Website E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-turbo-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-turbo-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # No `playwright install`: it hung indefinitely post-download on GitHub
      # runners (via bunx AND npx). CI drives the runner's preinstalled Chrome
      # instead (channel: "chrome" in playwright.config.ts).
      # playwright.config.ts builds and serves the app itself (webServer),
      # with CONTENT_SNAPSHOT_ONLY so no spec ever touches the network.
      - name: Run Website E2E
        run: bun run e2e
        working-directory: apps/web
        timeout-minutes: 12

  assetgen-gates:
    name: Deadrot Asset Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout Assetgen
        uses: actions/checkout@v6
        with:
          path: shipshitgames

      - name: Checkout Deadrot Assets
        uses: actions/checkout@v6
        with:
          repository: shipshitgames/deadrot.com
          path: deadrotcom

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            deadrotcom/.turbo
          key: ${{ runner.os }}-deadrot-assets-${{ hashFiles('shipshitgames/bun.lock', 'shipshitgames/packages/assetgen/package.json', 'deadrotcom/bun.lock', 'deadrotcom/turbo.json', 'deadrotcom/**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-deadrot-assets-

      - name: Install Assetgen Dependencies
        run: bun install --frozen-lockfile
        working-directory: shipshitgames

      - name: Install Deadrot Dependencies
        run: bun install --frozen-lockfile
        working-directory: deadrotcom

      - name: Verify Declared Assetgen Targets
        run: >-
          bun packages/assetgen/src/cli.ts ci-gates
          --config .github/assetgen/deadrot-assets.ci-gates.json
          --assets-dir ../deadrotcom/packages/assets
          --games-root ../deadrotcom/apps/games
        working-directory: shipshitgames

      - name: Verify Deadrot Asset Index
        run: bun run --cwd packages/assets assets:index:check
        working-directory: deadrotcom

  desktop-terminal:
    name: Desktop Terminal (node-pty)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-turbo-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-turbo-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Build node-pty from source against Electron's ABI (postinstall is skipped in
      # CI; this is the explicit build that produces build/Release/{pty.node,spawn-helper}).
      - name: Rebuild node-pty for Electron
        run: bun run --cwd apps/desktop rebuild:native

      # Launch a real shell under Electron's runtime and assert ok:true + pid +
      # streamed output. Exit 2 means the Electron binary couldn't be fetched on the
      # runner; treat that as skip rather than a failure so download flakiness doesn't
      # red the build. Exit 1 is a real regression and fails CI.
      - name: Verify terminal spawns a real shell
        run: |
          cd apps/desktop
          set +e
          bun run verify:terminal
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Electron binary unavailable on runner; skipped live terminal verification"
            exit 0
          fi
          exit $code

  desktop-packaged-runtime:
    name: Desktop Packaged Tooling Runtime
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-desktop-runtime-${{ hashFiles('bun.lock', 'apps/desktop/package.json', 'packages/assetgen/package.json', 'packages/ressources/package.json', 'packages/tester/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-desktop-runtime-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # package:dir builds the isolated production runtime, installs pinned
      # Chromium, packages an unpacked .app, and lets afterPack run the isolated
      # assetgen + ressources + tester smoke before signing.
      - name: Package and verify the self-contained tooling runtime
        run: bun run --cwd apps/desktop package:dir
        timeout-minutes: 25

      - name: Upload packaged runtime smoke record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-packaged-runtime-${{ runner.arch }}
          path: apps/desktop/out/runtime-smoke-*.json
          if-no-files-found: warn
          retention-days: 14
