name: CI

on:
  push:
    branches:
      - master
  # No branch filter: PRs into the master trunk must run the same checks as
  # any other PR — these are required status checks.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # All JS actions on Node 24 ahead of the 2026-06-16 default switch
  # (covers third-party actions still declaring node20, e.g. setup-bun).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Content fetchers (lib/github, lib/youtube) serve committed snapshots in CI.
  CONTENT_SNAPSHOT_ONLY: "1"
  ACCESS_SIGNING_SECRET: ci-access-signing-secret
  CLERK_SECRET_KEY: ci-clerk-secret-key
  NEXT_PUBLIC_APP_URL: http://localhost:3002
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  STRIPE_SKILLS_PRO_PRICE_ID: price_ci_placeholder
  STRIPE_STUDIO_PASS_PRICE_ID: price_ci_placeholder

jobs:
  monorepo:
    name: Monorepo Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-turbo-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-turbo-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Scaffold Smoke
        run: bun run ci:scaffold

      - name: Engine Package Check
        run: bun run ci:engine

      - name: Lint
        run: bun run lint

      - name: React Doctor
        run: bun run lint:react

      - name: Typecheck
        run: bun run typecheck

      - name: Test (with coverage)
        run: bun run test:coverage

      - name: Build
        run: bun run build

  web-e2e:
    name: Website E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-turbo-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-turbo-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # No `playwright install`: it hung indefinitely post-download on GitHub
      # runners (via bunx AND npx). CI drives the runner's preinstalled Chrome
      # instead (channel: "chrome" in playwright.config.ts).
      # playwright.config.ts builds and serves the app itself (webServer),
      # with CONTENT_SNAPSHOT_ONLY so no spec ever touches the network.
      - name: Run Website E2E
        run: bun run e2e
        working-directory: apps/web
        timeout-minutes: 12

  assetgen-gates:
    name: Deadrot Asset Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout Deadrot Assets
        uses: actions/checkout@v6
        with:
          repository: shipshitgames/deadrot.com
          path: deadrotcom

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            deadrotcom/.turbo
          key: ${{ runner.os }}-deadrot-assets-${{ hashFiles('deadrotcom/bun.lock', 'deadrotcom/turbo.json', 'deadrotcom/**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-deadrot-assets-

      - name: Install Deadrot Dependencies
        run: bun install --frozen-lockfile
        working-directory: deadrotcom

      - name: Verify Deadrot Asset Index
        run: bun run --cwd packages/assets assets:index:check
        working-directory: deadrotcom

      # Do not run `assetgen ci-gates` here until the Deadrot package commits an
      # assetgen-format index, atlas, or codegen target. Without `--strict` it
      # checks nothing; with `--strict` the current canonical package correctly
      # fails because no such target exists. The native index check above is the
      # real integrity gate today.

  desktop-terminal:
    name: Desktop Terminal (node-pty)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-turbo-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-turbo-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Build node-pty from source against Electron's ABI (postinstall is skipped in
      # CI; this is the explicit build that produces build/Release/{pty.node,spawn-helper}).
      - name: Rebuild node-pty for Electron
        run: bun run --cwd apps/desktop rebuild:native

      # Launch a real shell under Electron's runtime and assert ok:true + pid +
      # streamed output. Exit 2 means the Electron binary couldn't be fetched on the
      # runner; treat that as skip rather than a failure so download flakiness doesn't
      # red the build. Exit 1 is a real regression and fails CI.
      - name: Verify terminal spawns a real shell
        run: |
          cd apps/desktop
          set +e
          bun run verify:terminal
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Electron binary unavailable on runner; skipped live terminal verification"
            exit 0
          fi
          exit $code
